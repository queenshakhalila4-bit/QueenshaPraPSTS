<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Creativity Festival</title>
</head>
<body>
    <form>
      <h2>Student Creativity Festival</h2>
      <label>Full Name</label><br>
        <input type="text"><br><br>
        <label>Class</label><br>
        <select>
          <option>X</option>
          <option>XI</option>
          <option>XII</option>
        </select>
        <br><br>
        <label>Gender</label><br>
        <input type="radio"nama="gender">Male
        <input type="radio"nama="gender">Female
        <br><br>
        <select>
          <option>Web Develoment</option>
          <option>IoT Project</option>
          <option>Graphic Design</option>
          <option>Public Speaking</option>
          <option>Photography</option>
        </select>
        <br><br>
        <label>Praipation type</label>
        <input type="radio"nama="Praipation type">Individual
        <input type="radio"nama="Praipation type">Team
        <br><br>
        <label>Team Name</label><br>
        <input type="text"><br><br>
        <label>Contact Number</label>
        <input type="text"><br><br>
        <label>project Description</label>
        <textarea rows="5" cols="40"></textarea>
        <br><br>
        <button type="submit">Submit</button>
    </form>
    <table border>
      <tr>
        <th>No</th>
        <th>Participant</th>
        <th>Class</th>
        <th>Category</th>
        <th>Team</th>
        <th>Status</th>
      </tr>
    </table>
</body>
<body class="bg-gray-100 font-sans text-gray-800 min-h-screen py-10 px-4">
  <div class="max-w-2xl mx-auto bg-white rounded-xl shadow-lg overflow-hidden border border-gray-200"></div>

  <div class="bg-purple-200 px-6 py-6 text-white text center"></div>
</body>
